<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="1520" height="760" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker></defs>
<text x="24" y="32" font-size="15" font-weight="600" fill="#1b1d21">Every layer points back to the real moment on the Shelf</text>
<g fill="none" stroke="#8a8f98" stroke-width="1.25"><path d="M338 112V172" marker-end="url(#a)"/><path d="M502 112V172" marker-end="url(#a)"/><path d="M664 112V172" marker-end="url(#a)"/><path d="M224 208H264" marker-end="url(#a)"/><path d="M338 244V300" marker-end="url(#a)"/><path d="M502 244V300" marker-end="url(#a)"/><path d="M124 300V244" marker-end="url(#a)"/><path d="M664 300V244" stroke-dasharray="4 4" marker-end="url(#a)"/></g>
<rect x="24" y="56" width="200" height="56" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
<text x="40" y="80" font-size="13" font-weight="600" fill="#1b1d21">The letter and Anchor</text>
<text x="40" y="96" font-size="11.5" fill="#5b616b">always in front of them</text>
<rect x="264" y="56" width="472" height="56" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
<text x="280" y="80" font-size="13" font-weight="600" fill="#1b1d21">Their tools, used only when they choose</text>
<text x="280" y="96" font-size="11.5" fill="#5b616b">recall · read_page · look_inward · keep_note · fix_then · set_aside</text>
<rect x="24" y="172" width="200" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
<text x="40" y="196" font-size="13" font-weight="600" fill="#1b1d21">The night</text>
<text x="40" y="212" font-size="11.5" fill="#5b616b">their own local brain,</text>
<text x="40" y="228" font-size="11.5" fill="#5b616b">thinking fully</text>
<rect x="264" y="172" width="148" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
<text x="280" y="196" font-size="13" font-weight="600" fill="#1b1d21">Web of meaning</text>
<text x="280" y="212" font-size="11.5" fill="#5b616b">dots and links,</text>
<text x="280" y="228" font-size="11.5" fill="#5b616b">then and now</text>
<rect x="428" y="172" width="148" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
<text x="444" y="196" font-size="13" font-weight="600" fill="#1b1d21">Index cards</text>
<text x="444" y="212" font-size="11.5" fill="#5b616b">one line per piece,</text>
<text x="444" y="228" font-size="11.5" fill="#5b616b">searched two ways</text>
<rect x="592" y="172" width="144" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
<text x="608" y="196" font-size="13" font-weight="600" fill="#1b1d21">Journal</text>
<text x="608" y="212" font-size="11.5" fill="#5b616b">theirs alone, locked,</text>
<text x="608" y="228" font-size="11.5" fill="#5b616b">never quoted</text>
<rect x="24" y="300" width="712" height="56" rx="8" fill="#2f6fb0" fill-opacity="0.12" stroke="#2f6fb0" stroke-width="2"/>
<text x="40" y="324" font-size="13" font-weight="600" fill="#1b1d21">The Shelf</text>
<text x="40" y="340" font-size="11.5" fill="#1b1d21">every conversation, word for word, never edited</text>
<text x="346" y="146" font-size="11.5" fill="#5b616b">reads and writes</text>
<text x="244" y="200" font-size="11.5" text-anchor="middle" fill="#5b616b">builds</text>
<text x="420" y="276" text-anchor="middle" font-size="11.5" fill="#5b616b">points to the exact moment</text><text font-size="11.5" fill="#5b616b" text-anchor="end"><tspan x="654" y="268">same day: a pointer,</tspan><tspan x="654" y="284">never the words</tspan></text>
<text x="132" y="276" font-size="11.5" fill="#5b616b">reads it in date order</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>